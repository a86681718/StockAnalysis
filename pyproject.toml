[project]
name = "stockanalysis"
version = "0.1.0"
description = ""
authors = [
    {name = "TTFang",email = "a86681718@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "opencv-python[contrib] (>=4.11.0.86,<5.0.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "pandas>=2.2.3,<3.0.0",
    "bs4 (>=0.0.2,<0.0.3)",
    "tensorflow (<=2.15)",
    "google-cloud-storage (>=3.1.0,<4.0.0)",
    "pyarrow>=23.0.0",
    "matplotlib>=3.10.8",
    "tqdm>=4.67.1",
    "dash>=4.0.0",
    "numpy>=2.4.1",
    "plotly>=6.5.2",
    "xlrd>=2.0.2",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.uv.workspace]
members = [
    "apps/etl",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.5.2",
]
